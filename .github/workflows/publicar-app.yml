name: Publicar la app

# Cada vez que cambie algo dentro de app/ y se suba a main, GitHub vuelve a
# publicar la carpeta en GitHub Pages. No compila nada: app/ ya lleva dentro
# todo lo que necesita (los datos los genera src/15_app_data.py en tu
# ordenador, y viajan con el commit).

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/publicar-app.yml'
  workflow_dispatch:          # y a mano, desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si se suben dos cambios seguidos, se publica el ultimo y se cancela el otro.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: despliegue
        uses: actions/deploy-pages@v4
